version: "3.8"

services:
  fragbase2-app:
    build: .
    container_name: fragbase2-dev
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.wrangler
    environment:
      - NEXTJS_ENV=development
      - CI=true
      - TERM=dumb
    working_dir: /app
    command: sh -c "npm run build && npx opennextjs-cloudflare build && npx wrangler d1 migrations apply fragbase --local && npx wrangler dev --config wrangler.jsonc --port 8787 --ip 0.0.0.0 --local"
    stdin_open: true
    tty: true
